name: Keep Repository Alive

on:
  schedule:
    # Runs every 10 hours (at minute 0 of hour 0, 10, 20, etc.)
    - cron: '0 */10 * * *'
  workflow_dispatch: # Allows you to trigger the workflow manually from the Actions tab

permissions:
  contents: write # Crucial: Gives the action permission to push back to the repository

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create Empty Commit and Push
        run: |
          git commit --allow-empty -m "chore: automated keep-alive empty commit [skip ci]"
          git push origin main
